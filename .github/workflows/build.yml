name: Build GestureX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Theos
        uses: Randomblock1/theos-action@v1

      - name: Build package
        run: make clean package FINALPACKAGE=1 ADDITIONAL_CFLAGS="-fno-modules" ADDITIONAL_CCFLAGS="-fno-modules"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: GestureX-deb
          path: packages/*.deb
          if-no-files-found: error
